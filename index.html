<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchestre à Cordes - Partitions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Orchestre à Cordes</h1>
            <p class="subtitle">Bibliothèque de Partitions</p>
        </header>

        <div class="controls">
            <div class="instrument-selector">
                <label for="myInstrument">Mon instrument :</label>
                <select id="myInstrument">
                    <option value="all">Tous les instruments</option>
                    <option value="violon1">Violon 1</option>
                    <option value="violon2">Violon 2</option>
                    <option value="violon3">Violon 3</option>
                    <option value="violoncelle1">Violoncelle 1</option>
                    <option value="violoncelle2">Violoncelle 2</option>
                </select>
                <label class="remember-choice">
                    <input type="checkbox" id="rememberInstrument">
                    <span>Se souvenir de mon choix</span>
                </label>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Rechercher un morceau...">
                <span class="search-icon">🔍</span>
            </div>
        </div>

        <div id="pieceCount" class="piece-count"></div>

        <div id="piecesList" class="pieces-list">
            <!-- Pieces will be loaded here by JavaScript -->
        </div>

        <footer>
            <p>Orchestre à Cordes - Nord Deux Sèvres</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
